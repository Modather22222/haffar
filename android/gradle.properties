org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation cannot handle cross-drive source roots on Windows:
# pub cache is on C:\pub-cache while this project is on D:\projects -> RelocatableFileToPathConverter
# throws "this and base files have different roots" and fails to close incremental caches.
kotlin.incremental=false
# Avoid the Kotlin daemon entirely: daemon start/connect was also failing during the
# cross-drive cache crash. In-process compile is slightly slower but far more reliable here.
kotlin.compiler.execution.strategy=in-process
