name: haffar
description: "حفار - Gamified Arabic Learning App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^14.0.0
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  audioplayers: ^6.1.0
  supabase_flutter: ^2.17.2
  permission_handler: ^11.3.1
  lucide_flutter: ^1.33.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - fonts/
    - assets/audio/
    - assets/character/
    - assets/subjects/
    - assets/icons/
    - assets/apps/
    - assets/banners/

  fonts:
    # Be Vietnam Pro — headlines, labels, display text (Arabic support)
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: fonts/BeVietnamPro-Black.ttf
          weight: 900
        - asset: fonts/BeVietnamPro-BlackItalic.ttf
          weight: 900
          style: italic

    # Plus Jakarta Sans — body text (variable font, all weights)
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Variable.ttf
        - asset: fonts/PlusJakartaSans-VariableItalic.ttf
          style: italic

    # Lucide icons
    - family: LucideIcons
      fonts:
        - asset: fonts/lucide.ttf
