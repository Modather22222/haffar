name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLUTTER_VERSION: "3.41.9"
      # Increment this when publishing a new release
      VERSION_CODE: "${{ github.run_number }}"
      VERSION_NAME: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}
          restore-keys:
            ${{ runner.os }}-flutter-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:pub-get-:-${{ hashFiles('**/pubspec.lock') }}

      - name: Decode Keystore
        run: |
          mkdir -p android/key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/key/release.keystore
          echo "key.store=android/key/release.keystore" >> gradle.properties
          echo "key.alias=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "key.store.password=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "key.key.password=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test || true

      - name: Build Release APK (ARM64)
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="VERSION_CODE=${{ env.VERSION_CODE }}" \
            --dart-define="VERSION_NAME=${{ env.VERSION_NAME }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haffar-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK mapping
        uses: actions/upload-artifact@v4
        with:
          name: haffar-mapping
          path: build/app/outputs/mapping/release/
          retention-days: 30
