name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLUTTER_VERSION: "3.41.9"
      VERSION_NAME: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:pub-get-:-${{ hashFiles('**/pubspec.lock') }}

      - name: Decode Keystore
        run: |
          mkdir -p android/key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/key/release.keystore
          ls -l android/key/release.keystore
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK (ARM64)
        env:
          KEYSTORE_PATH: android/key/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            "--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            "--dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            "--dart-define=VERSION_CODE=${{ github.run_number }}" \
            "--dart-define=VERSION_NAME=${{ env.VERSION_NAME }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haffar-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload APK mapping
        uses: actions/upload-artifact@v4
        with:
          name: haffar-mapping
          path: build/app/outputs/mapping/release/
          retention-days: 30
          if-no-files-found: ignore
