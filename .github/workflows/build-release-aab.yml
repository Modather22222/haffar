name: Build Release AAB

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLUTTER_VERSION: "3.41.9"
      VERSION_NAME: "1.0.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-:pub-get-:-${{ hashFiles('**/pubspec.lock') }}

      - name: Validate secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || { echo "::error::SUPABASE_URL secret is empty"; exit 1; }
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || { echo "::error::SUPABASE_ANON_KEY secret is empty"; exit 1; }
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "::error::KEYSTORE_BASE64 secret is empty"; exit 1; }
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "::error::KEYSTORE_PASSWORD secret is empty"; exit 1; }
          test -n "${{ secrets.KEY_ALIAS }}" || { echo "::error::KEY_ALIAS secret is empty"; exit 1; }
          test -n "${{ secrets.KEY_PASSWORD }}" || { echo "::error::KEY_PASSWORD secret is empty"; exit 1; }
        shell: bash

      - name: Write env.json
        run: |
          jq -n \
            --arg SUPABASE_URL "${{ secrets.SUPABASE_URL }}" \
            --arg SUPABASE_ANON_KEY "${{ secrets.SUPABASE_ANON_KEY }}" \
            '{SUPABASE_URL: $SUPABASE_URL, SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY}' \
            > env.json
          jq -e 'has("SUPABASE_URL") and has("SUPABASE_ANON_KEY") and ((.SUPABASE_URL | length) > 0) and ((.SUPABASE_ANON_KEY | length) > 0)' env.json > /dev/null
          echo "env.json written with dart-defines: $(jq -r 'keys | join(", ")' env.json)"
        shell: bash

      - name: Decode Keystore
        run: |
          mkdir -p android/key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/key/release.keystore
          test -s android/key/release.keystore || { echo "::error::Decoded keystore is empty — check the KEYSTORE_BASE64 secret"; exit 1; }
          ls -l android/key/release.keystore
        shell: bash

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run analyzer
        run: flutter analyze lib/ test/

      - name: Run tests
        run: flutter test

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/key/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define-from-file=env.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: haffar-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload AAB mapping
        uses: actions/upload-artifact@v4
        with:
          name: haffar-aab-mapping
          path: build/app/outputs/mapping/release/
          retention-days: 30
          if-no-files-found: ignore
